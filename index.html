<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#140c09" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="《唐宋荣耀》— 唐风宋韵 5v5 网页 MOBA，六大唐宋名士汴京演武。" />
    <title>唐宋荣耀</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a100c'/%3E%3Crect x='5' y='5' width='54' height='54' rx='11' fill='none' stroke='%23e8be6a' stroke-width='2.4'/%3E%3Ccircle cx='32' cy='32' r='16' fill='%23b63226' stroke='%23ffe9b5' stroke-width='1.8'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23fff6d9'/%3E%3C/svg%3E" />
    <style>
      @font-face {
        font-family: 'TangSongBrush';
        src: url('/assets/fonts/tangsong-brush.woff2') format('woff2');
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: 'TangSongSerif';
        src: url('/assets/fonts/tangsong-serif.woff2') format('woff2');
        font-weight: 400;
        font-display: swap;
      }

      html, body { margin: 0; height: 100%; background: #120b08; overflow: hidden; overscroll-behavior: none; }
      body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #app { position: fixed; inset: 0; overflow: hidden; background: #120b08; }

      /* 唐宋漆器金印启动遮罩：纯 CSS，内核就绪后淡出移除 */
      #boot {
        position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; overflow: hidden;
        font-family: "TangSongSerif", "Songti SC", "STSong", "Noto Serif SC", serif;
        color: #f8eed8;
        background:
          radial-gradient(circle at 22% 28%, rgba(255, 214, 130, 0.14), transparent 22%),
          radial-gradient(circle at 78% 72%, rgba(90, 152, 206, 0.12), transparent 28%),
          radial-gradient(115% 85% at 50% 0%, #2b1a12 0%, #170e0a 52%, #0d0806 100%);
        transition: opacity 0.45s ease-out;
      }
      #boot.is-done { opacity: 0; pointer-events: none; }
      .boot__inner { display: flex; flex-direction: column; align-items: center; padding: 16px; text-align: center; }
      .boot__mark { width: min(30vmin, 132px); height: min(30vmin, 132px); filter: drop-shadow(0 0 18px rgba(232, 190, 106, 0.45)); }
      .boot__ring { transform-origin: 60px 60px; animation: boot-ring 9s linear infinite; }
      .boot__seal { transform-origin: 60px 60px; animation: boot-seal 2.8s ease-in-out infinite; }
      .boot__name {
        margin-top: 8px; font-family: "TangSongBrush", "TangSongSerif", "KaiTi", serif; font-size: clamp(36px, 9.2vmin, 66px); font-weight: 400; line-height: 1.18; letter-spacing: 0.2em; margin-right: -0.2em; color: #f6d488;
        text-shadow: 0 2px 14px rgba(20, 10, 4, 0.9);
        background: linear-gradient(180deg, #fffdf4 0%, #ffe8b0 34%, #e2b155 66%, #9e6a20 100%);
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      }
      .boot__sub { display: flex; align-items: center; gap: 12px; margin-top: 5px; font-size: clamp(11px, 2.3vmin, 15px); font-weight: 700; letter-spacing: 0.46em; color: #9fc8e4; font-family: "TangSongSerif", "PingFang SC", sans-serif; }
      .boot__sub b { margin-right: -0.46em; }
      .boot__sub i { width: clamp(28px, 9vmin, 64px); height: 1px; background: linear-gradient(90deg, transparent, #e8be6a); }
      .boot__sub i:last-child { transform: scaleX(-1); }
      .boot__bar { position: relative; width: min(56vmin, 260px); height: 3px; margin-top: 26px; border-radius: 3px; background: rgba(232, 190, 106, 0.18); overflow: hidden; }
      .boot__bar span { position: absolute; top: 0; bottom: 0; left: 0; width: 40%; border-radius: 3px; background: linear-gradient(90deg, transparent, #7fd4c4 30%, #ffe6ad 72%, transparent); animation: boot-bar 1.25s ease-in-out infinite; }
      .boot__tip { min-height: 1.6em; margin: 12px 0 0; max-width: 30em; font-size: 13px; line-height: 1.6; letter-spacing: 0.1em; color: #cabaa0; }
      #boot.is-error .boot__bar { display: none; }
      #boot.is-error .boot__tip { color: #ffb4a8; letter-spacing: 0.02em; }
      @keyframes boot-ring { to { transform: rotate(360deg); } }
      @keyframes boot-seal { 0%, 100% { transform: scale(0.96); opacity: 0.92; } 50% { transform: scale(1.03); opacity: 1; } }
      @keyframes boot-bar { 0% { transform: translateX(-110%); } 100% { transform: translateX(290%); } }
      @media (prefers-reduced-motion: reduce) { .boot__ring, .boot__seal, .boot__bar span { animation-duration: 6s; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot" role="status" aria-live="polite">
      <div class="boot__inner">
        <svg class="boot__mark" viewBox="0 0 120 120" aria-hidden="true">
          <defs>
            <linearGradient id="boot-gold" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fffdf4" /><stop offset=".55" stop-color="#f2c973" /><stop offset="1" stop-color="#9e6a1e" />
            </linearGradient>
            <radialGradient id="boot-halo">
              <stop offset="0" stop-color="#ffd98a" stop-opacity=".42" /><stop offset="1" stop-color="#ffd98a" stop-opacity="0" />
            </radialGradient>
          </defs>
          <circle cx="60" cy="60" r="48" fill="url(#boot-halo)" />
          <g class="boot__ring">
            <circle cx="60" cy="60" r="46" fill="none" stroke="#e8be6a" stroke-opacity=".42" stroke-width="1.5" stroke-dasharray="10 6 2 6" />
            <circle cx="60" cy="60" r="39" fill="none" stroke="#7fd4c4" stroke-opacity=".6" stroke-width="1.4" stroke-dasharray="34 210" stroke-linecap="round" />
          </g>
          <g class="boot__seal">
            <rect x="33" y="33" width="54" height="54" rx="10" transform="rotate(45 60 60)" fill="#2a1610" stroke="url(#boot-gold)" stroke-width="2.4" />
            <circle cx="60" cy="60" r="15" fill="#b83226" stroke="#fff2c8" stroke-width="1.8" />
            <circle cx="60" cy="60" r="4.5" fill="#fff8de" />
          </g>
        </svg>
        <div class="boot__name">唐宋荣耀</div>
        <div class="boot__sub"><i></i><b>TANG · SONG</b><i></i></div>
        <div class="boot__bar"><span></span></div>
        <p class="boot__tip" id="boot-tip">正在开启汴京画卷…</p>
        <noscript><p class="boot__tip">需要启用 JavaScript 才能运行游戏。</p></noscript>
      </div>
    </div>
    <script>
      (function () {
        var boot = document.getElementById('boot');
        var tip = document.getElementById('boot-tip');
        if (!boot || !tip) return;
        function say(text, isError) {
          if (window.__mobaBooted) return;
          tip.textContent = text;
          if (isError) boot.classList.add('is-error');
        }
        window.addEventListener('error', function (ev) {
          say('启动失败：' + ((ev && ev.message) || '脚本未能运行') + '。请刷新页面重试。', true);
        });
        setTimeout(function () {
          say('载入时间比预期长，请稍候…若一直停在这里，请刷新页面或换用新版浏览器。', false);
        }, 15000);
      })();
    </script>
    <script nomodule>
      document.getElementById('boot').classList.add('is-error');
      document.getElementById('boot-tip').textContent = '当前浏览器版本过旧，无法运行游戏。请更新浏览器后再试。';
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
